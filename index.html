<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>프롤로그 - 웹툰 뷰어</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background-color: #09090b;
      color: #e4e4e7;
      font-family: -apple-system, BlinkMacSystemFont, "Malgun Gothic", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      width: 100%;
      max-width: 720px;
      padding: 14px 16px;
      background: rgba(9, 9, 11, 0.9);
      border-bottom: 1px solid #27272a;
      text-align: center;
      font-size: 15px;
      font-weight: 600;
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .viewer {
      width: 100%;
      max-width: 720px;
      display: flex;
      flex-direction: column;
    }
    .viewer img {
      width: 100%;
      height: auto;
      display: block;
    }
    .footer {
      width: 100%;
      max-width: 720px;
      padding: 32px 16px 48px;
      text-align: center;
      font-size: 13px;
      color: #71717a;
      background-color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="header">프롤로그</div>
  <div class="viewer">
    <img src="01.png" alt="1컷" />
    <img src="02.png" alt="2컷" />
    <img src="03.png" alt="3컷" />
    <img src="04.png" alt="4컷" />
    <img src="05.png" alt="5컷" />
    <img src="06.png" alt="6컷" />
    <img src="07.png" alt="7컷" />
  </div>
  <div class="footer">Prologue - END</div>
</body>
</html>
